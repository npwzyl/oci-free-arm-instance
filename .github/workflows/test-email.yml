name: Test Email

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl, datetime
          from email.message import EmailMessage
          from email.utils import formataddr

          server = os.environ.get("SMTP_SERVER", "smtp.163.com")
          port = int(os.environ.get("SMTP_PORT") or 465)
          user = os.environ["SMTP_USER"]
          pwd = os.environ["SMTP_PASSWORD"]
          to = os.environ.get("NOTIFY_TO", user)
          use_ssl = os.environ.get("SMTP_SSL", "true").lower() == "true"

          if pwd.startswith("PLACEHOLDER"):
              raise SystemExit("❌ SMTP_PASSWORD 仍是占位值，请先在仓库 Settings 里更新为真实授权码")

          body = (
              "这是一封测试邮件。\n\n"
              "如果你收到了它，说明抢到 Oracle 免费 ARM 实例后的通知邮件可以正常送达。\n\n"
              f"发件账号: {user}\n"
              f"收件地址: {to}\n"
              f"测试时间: {datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')} (UTC)\n"
          )

          msg = EmailMessage()
          msg["Subject"] = "✅ 测试邮件 - OCI 抢机通知已就绪"
          msg["From"] = formataddr(("OCI 抢机机器人", user))
          msg["To"] = to
          msg.set_content(body)

          try:
              if use_ssl:
                  ctx = ssl.create_default_context()
                  with smtplib.SMTP_SSL(server, port, context=ctx, timeout=60) as s:
                      s.login(user, pwd)
                      s.send_message(msg)
              else:
                  with smtplib.SMTP(server, port, timeout=60) as s:
                      s.starttls(context=ssl.create_default_context())
                      s.login(user, pwd)
                      s.send_message(msg)
          except smtplib.SMTPAuthenticationError as e:
              raise SystemExit(f"❌ SMTP 认证失败，授权码可能不对或已失效：{e}")
          except Exception as e:
              raise SystemExit(f"❌ 发送失败：{type(e).__name__}: {e}")

          print(f"✅ 测试邮件已发送至 {to}")
          PY
